services:
  - type: web
    name: denopsystems
    runtime: node
    plan: starter            # persistent disk needs a paid plan
    buildCommand: echo "no build"
    startCommand: node server.js
    disk:
      name: denop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
